title: For the beautiful world !
subtitle: >-
  Ich bin ein Geländer am Strome: fasse mich, wer mich fassen kann! Eure Krücke
  aber bin ich nicht.
description: >-
  Welcome to my blog! Contact me via "quiddite[number
  four]dino[at]gmail[dot]com"
keywords: quiddite
author: quiddite
language: 'en'
timezone: ''
url: https://quiddite.github.io
permalink: ':title/'
permalink_defaults: null
pretty_urls:
  trailing_index: true
  trailing_html: true
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: ':lang'
skip_render:
  - "notes/**"
new_post_name: ':title.md'
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: true
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''
index_generator:
  path: ''
  per_page: 10
  order_by: '-date'
default_category: uncategorized
category_map: null
tag_map: null
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime
per_page: 10
pagination_dir: page
include: null
exclude: null
ignore: null
theme: fluid
deploy:
  type: git
  repo: git@github.com:quiddite/quiddite.github.io.git
  branch: main
  message: null
mathjax:
  tags: ams
  single_dollars: true
  cjk_width: 0.9
  normal_width: 1
  append_css: true
  every_page: false
  packages: null
  extension_options: {}
  config:
    latex:
      packages:
        - base
        - ams
      inlineMath:
        - - $
          - $
        - - \(
          - \)
      displayMath:
        - - $$
          - $$
        - - \[
          - \]
    options:
      displayAlign: left
      displayIndent: 10em

# hexo-tag-common 通用标签插件
tag_common:
  cdn: https://fastly.jsdelivr.net/npm/   # 默认 CDN，照抄即可
  layout:
    - post
    - page
    # - home   # 如果希望首页也启用标签解析，可以把这一行的注释去掉
